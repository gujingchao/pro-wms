services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and choose a password}
      POSTGRES_DB: pro_wms
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms -d pro_wms"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      PRO_WMS_REPOSITORY: postgres
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: wms
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATABASE: pro_wms
      DATABASE_URL: "dbname=pro_wms"
      PRO_WMS_ENABLE_DEMO: ${PRO_WMS_ENABLE_DEMO:-0}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
